name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

# Новый пуш в ту же ветку отменяет старый незаконченный прогон.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Тесты фронтенда
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Отчёт браузерных тестов
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: playwright-results
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

  security:
    name: Проверка зависимостей
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Установить govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - name: Уязвимости Go
        working-directory: src
        run: govulncheck ./...
      - name: Уязвимости npm
        working-directory: frontend
        run: npm audit --audit-level=high

  test:
    name: Проверки и тесты
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src

    # PostgreSQL для интеграционных тестов: они читают TEST_DATABASE_URL,
    # без неё пропускаются (t.Skip).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: zapas
          POSTGRES_PASSWORD: zapas
          POSTGRES_DB: zapas
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U zapas"
          --health-interval 2s
          --health-retries 15

    env:
      TEST_DATABASE_URL: postgres://zapas:zapas@localhost:5432/zapas?sslmode=disable

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum

      - name: Форматирование (gofmt)
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Файлы не отформатированы, запустите gofmt -w:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Сборка
        run: go build ./...

      - name: Миграции применяются к чистой базе
        run: |
          go build -o /tmp/server ./cmd/server
          DATABASE_URL="$TEST_DATABASE_URL" HTTP_ADDR=:18080 /tmp/server > /tmp/server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf localhost:18080/health && break
            sleep 1
          done
          cat /tmp/server.log
          curl -sf localhost:18080/health
          kill $!

      - name: Тесты
        run: go test -race -count=1 -p 1 ./... # -p 1: пакеты с БД не мешают друг другу

  docker:
    name: docker compose и демо-сценарии
    runs-on: ubuntu-latest
    needs: [test, frontend, security]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Поднять всё, как эксперт по README
        run: docker compose up -d --build --wait

      - name: Демо-сценарии дают ожидаемые решения
        run: |
          check() { # сценарий, ожидаемое действие, ожидаемая сумма в копейках
            got=$(curl -sf -X POST "localhost:8080/api/scenarios/$1/run" | jq -r '"\(.decision.action // "none") \(.decision.amount // 0)"')
            echo "$1: $got"
            [ "$got" = "$2 $3" ] || { echo "ожидали: $2 $3"; exit 1; }
          }
          check stable        auto          300000
          check income_drop   ask           100000
          check simple_mode   auto          240000
          check self_transfer none          0
          check new_client    ask           300000
          check income_rise   suggest_raise 360000

      - name: Фронтенд и прокси API работают
        run: |
          curl -sf localhost:5173 | grep -q '<div id="root"></div>'
          curl -sf localhost:5173/savings | grep -q '<div id="root"></div>'
          curl -sf localhost:5173/health | jq -e '.status == "ok"'
          curl -sf localhost:5173/api/clients/anya/savings | jq -e '.client_id == "anya"'

      - name: Swagger UI открывается
        run: curl -sf -o /dev/null localhost:8081

      - name: Логи бэкенда
        if: always()
        run: docker compose logs backend

      - name: Остановить
        if: always()
        run: docker compose down -v
