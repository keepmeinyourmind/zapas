openapi: 3.0.3
info:
  title: Запас — умная копилка
  version: 0.3.0
  description: |
    Контракт бэкенда «Запас». Менять только по согласованию с фронтендом.

    - Все суммы — **целые числа в копейках** (3000 ₽ = `300000`).
    - Время — RFC 3339 (`2026-10-25T10:00:00Z`).
    - Тексты `reason` на русском, готовы к показу клиенту.
servers:
  - url: http://localhost:8080

# Авторизации в MVP нет
security: []

tags:
  - name: system
  - name: onboarding
    description: Анкета при подключении
  - name: rule
    description: Правило копилки
  - name: transactions
  - name: decisions
  - name: events
    description: События банка по счёту
  - name: demo
    description: Только для демо и тестов

paths:
  /health:
    get:
      tags: [system]
      summary: Проверка живости
      responses:
        "200":
          description: Сервис работает
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }

  /api/clients/{id}/onboarding:
    parameters:
      - $ref: "#/components/parameters/ClientID"
    post:
      tags: [onboarding]
      summary: Заполнить анкету перед подключением копилки
      description: |
        Первый шаг подключения. Порядок проверок: согласие на обработку данных →
        возраст (18+) → есть ли доход → обязательные платежи меньше дохода → баллы анкеты.
        Без `data_consent: true` — 400, анкета не сохраняется.
        Отказ по возрасту, доходу или баллам — 200 с `eligible: false` и причинами в `reasons`.
        `analysis_consent: false` → простой режим (`mode: simple`): фиксированный процент
        с каждого поступления, без анализа операций и без вопросов.
        Повторная анкета заменяет прежнюю.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OnboardingRequest" }
            example:
              data_consent: true
              analysis_consent: true
              birth_date: "2006-03-15"
              monthly_income: 3000000
              income_type: mixed
              income_stability: irregular
              income_months: 8
              has_loans: true
              monthly_payments: 700000
      responses:
        "200":
          description: Анкета принята, в ответе — доступна ли копилка
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OnboardingResult" }
              examples:
                eligible:
                  value: { client_id: anya, eligible: true, score: 80, mode: smart, reasons: [] }
                rejected:
                  value: { client_id: teen, eligible: false, score: 0, mode: smart, reasons: ["Копилка доступна с 18 лет"] }
        "400": { $ref: "#/components/responses/ValidationError" }

  /api/clients/{id}/rule:
    parameters:
      - $ref: "#/components/parameters/ClientID"
    put:
      tags: [rule]
      summary: Создать или заменить правило копилки
      description: |
        Нужна одобренная анкета (`POST /onboarding`), иначе 409.
        `declared_income` по умолчанию берётся из анкеты (`monthly_income`).
        Тихие часы по умолчанию — 23:00–09:00, `Europe/Moscow`. `client_id` берётся из пути.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SavingsRule" }
            example:
              goal_name: Подушка
              goal_amount: 3600000
              term_months: 12
              save_percent: 10
              min_income: 300000
              min_transfer: 10000
              declared_income: 3000000
              paused: false
              quiet_from: "23:00"
              quiet_to: "09:00"
              timezone: Europe/Moscow
      responses:
        "200":
          description: Правило сохранено
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SavingsRule" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "409": { $ref: "#/components/responses/Conflict" }
    patch:
      tags: [rule]
      summary: Частично изменить правило (пауза, процент, тихие часы)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SavingsRulePatch" }
            example:
              paused: true
      responses:
        "200":
          description: Правило обновлено
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SavingsRule" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/transactions:
    post:
      tags: [transactions]
      summary: Принять транзакцию по карте
      description: |
        Идемпотентно по `id`: повторная отправка той же транзакции не создаёт
        второго решения и второго перевода. Ответ содержит решение, если
        поступление признано доходом, и `null` в остальных случаях.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Transaction" }
            example:
              id: tx-1001
              client_id: anya
              amount: 3000000
              type: incoming
              counterparty: ООО Ромашка
              counterparty_kind: legal
              occurred_at: "2026-10-25T10:00:00Z"
      responses:
        "200":
          description: Транзакция уже была обработана ранее (повтор)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TransactionResult" }
        "201":
          description: Транзакция принята
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TransactionResult" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/clients/{id}/transactions:
    parameters:
      - $ref: "#/components/parameters/ClientID"
    get:
      tags: [transactions]
      summary: Операции с меткой классификатора
      description: Для экрана «Доходы и расходы». Сортировка по `occurred_at`, новые первыми.
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: Список операций
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ClassifiedTransaction" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/clients/{id}/savings:
    parameters:
      - $ref: "#/components/parameters/ClientID"
    get:
      tags: [rule]
      summary: Баланс копилки, цель и прогресс
      responses:
        "200":
          description: Состояние копилки
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Savings" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/clients/{id}/decisions:
    parameters:
      - $ref: "#/components/parameters/ClientID"
    get:
      tags: [decisions]
      summary: История решений с причинами
      parameters:
        - name: status
          in: query
          description: Фильтр по статусу, например `pending` — открытые вопросы
          schema: { $ref: "#/components/schemas/DecisionStatus" }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: Решения, новые первыми
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Decision" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/decisions/{id}/answer:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [decisions]
      summary: Ответить на вопрос системы
      description: |
        Для вопроса о сумме (`action=ask`): `choice=amount` — перевести `amount`
        (одна из `options` либо не больше безопасной суммы); `choice=skip` — пропустить.
        Для вопроса «это ваш доход?» (`action=confirm_income`): `choice=yes` — отправитель
        становится подтверждённым, по поступлению принимается решение о сумме;
        `choice=no` — не доход.
        Отвечать можно только на активный вопрос (`pending`); `queued` ждут своей очереди.
        Если вопрос уже истёк, вернётся `409` с тем, что сделано автоматически.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AnswerRequest" }
            examples:
              amount:
                value: { choice: amount, amount: 100000 }
              skip:
                value: { choice: skip }
      responses:
        "200":
          description: Ответ принят, решение обновлено
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Decision" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Вопрос уже закрыт (истёк или есть ответ), ещё в очереди или счёт арестован
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/events/account:
    post:
      tags: [events]
      summary: Событие банка по счёту (арест / снятие ареста)
      description: |
        Приходит от систем банка, как транзакции. Идемпотентно по `id`.
        События могут прийти не по порядку: применяется только событие новее последнего.
        Пока счёт арестован, переводов в копилку нет, а ответы на вопросы возвращают 409.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccountEvent" }
            example:
              id: ev-1
              client_id: anya
              type: arrest_imposed
              occurred_at: "2026-10-26T10:00:00Z"
      responses:
        "201":
          description: Событие применено
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountState" }
        "200":
          description: Повтор события, ничего не изменилось
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountState" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/scenarios/{name}/run:
    parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
          enum: [stable, income_drop, simple_mode, self_transfer, new_client, income_rise]
    post:
      tags: [demo]
      summary: Сбросить клиента Аню и прогнать сценарий
      description: |
        Детерминированно, одинаковый сценарий всегда даёт одинаковый результат.
        Время сервиса фиксируется на дате события (20.10.2026, 10:00 МСК); `advance-time` сдвигает его дальше.
      responses:
        "200":
          description: Сценарий выполнен
          content:
            application/json:
              schema:
                type: object
                properties:
                  client_id: { type: string, example: anya }
                  scenario: { type: string, example: income_drop }
                  description: { type: string, example: "Пришло 24 000 ₽ вместо 30 000, через 5 дней рассрочка" }
                  income_kind: { $ref: "#/components/schemas/IncomeKind" }
                  decision:
                    nullable: true
                    description: "`null`, если поступление не доход (сценарий self_transfer)"
                    allOf:
                      - $ref: "#/components/schemas/Decision"
                  savings: { $ref: "#/components/schemas/Savings" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/debug/advance-time:
    post:
      tags: [demo]
      summary: Сдвинуть время вперёд, чтобы сработали таймауты
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hours]
              properties:
                hours: { type: integer, minimum: 1, example: 25 }
      responses:
        "200":
          description: Просроченные вопросы закрыты безопасным вариантом
          content:
            application/json:
              schema:
                type: object
                properties:
                  now: { type: string, format: date-time, description: Время сервиса после сдвига }
                  expired:
                    type: array
                    items: { $ref: "#/components/schemas/Decision" }

components:
  parameters:
    ClientID:
      name: id
      in: path
      required: true
      schema: { type: string, example: anya }

  responses:
    ValidationError:
      description: Некорректные данные
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: Процент должен быть от 1 до 50 }
    Conflict:
      description: Действие сейчас невозможно (нет анкеты, копилка недоступна, счёт арестован)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: "Сначала заполните анкету: без неё копилку подключить нельзя" }
    NotFound:
      description: Не найдено
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Money:
      type: integer
      format: int64
      description: Сумма в копейках
      example: 300000

    Error:
      type: object
      required: [error]
      properties:
        error: { type: string, description: Сообщение на русском }

    TxKind:
      type: string
      enum: [incoming, outgoing, refund, internal, loan]

    CounterpartyKind:
      type: string
      description: Вид отправителя или получателя
      enum: [legal, person, self, bank]

    IncomeKind:
      type: string
      enum: [salary, advance, bonus, scholarship, freelance, none]

    DecisionAction:
      type: string
      description: |
        `confirm_income` — вопрос «это ваш доход?» про поступление от незнакомого физлица.
      enum: [auto, ask, skip, suggest_raise, confirm_income]

    DecisionStatus:
      type: string
      description: |
        `queued` — вопрос ждёт, пока клиент ответит на предыдущий: активный вопрос у клиента один.
      enum: [queued, pending, executed, skipped, expired]

    Mode:
      type: string
      description: "`smart` — с анализом доходов; `simple` — фиксированный процент, как автопополнение"
      enum: [smart, simple]

    OnboardingRequest:
      type: object
      required: [data_consent, analysis_consent, birth_date, monthly_income, income_type, income_stability, income_months, has_loans, monthly_payments]
      properties:
        data_consent: { type: boolean, description: "Согласие на обработку персональных данных (152-ФЗ); без него 400" }
        analysis_consent: { type: boolean, description: "Согласие на анализ доходов и расходов; false → простой режим" }
        birth_date: { type: string, format: date, example: "2006-03-15" }
        monthly_income:
          description: Примерный доход в месяц
          allOf:
            - $ref: "#/components/schemas/Money"
        income_type:
          type: string
          enum: [salary, scholarship, freelance, mixed, none]
        income_stability:
          type: string
          enum: [stable, irregular]
        income_months: { type: integer, minimum: 0, description: Сколько месяцев уже есть доход }
        has_loans: { type: boolean, description: "Есть ли кредиты, рассрочки, займы" }
        monthly_payments:
          description: "Обязательные платежи в месяц: кредиты, рассрочки, аренда, связь, подписки"
          allOf:
            - $ref: "#/components/schemas/Money"

    OnboardingResult:
      type: object
      required: [client_id, eligible, score, mode, reasons]
      properties:
        client_id: { type: string }
        eligible: { type: boolean, description: Доступна ли копилка }
        score: { type: integer, minimum: 0, maximum: 100, description: Баллы анкеты }
        mode: { $ref: "#/components/schemas/Mode" }
        reasons:
          type: array
          description: Причины отказа на русском, готовы к показу; пусто, если доступна
          items: { type: string }

    AccountEvent:
      type: object
      required: [id, client_id, type, occurred_at]
      properties:
        id: { type: string, description: Уникален; по нему идемпотентность }
        client_id: { type: string }
        type: { type: string, enum: [arrest_imposed, arrest_lifted] }
        occurred_at: { type: string, format: date-time }

    AccountState:
      type: object
      properties:
        client_id: { type: string }
        arrested: { type: boolean }

    SavingsRule:
      type: object
      required: [goal_name, goal_amount, term_months, save_percent]
      properties:
        client_id: { type: string, readOnly: true, example: anya }
        goal_name: { type: string, example: Подушка }
        goal_amount: { $ref: "#/components/schemas/Money" }
        term_months: { type: integer, enum: [6, 12, 24] }
        save_percent:
          type: integer
          minimum: 1
          maximum: 50
          description: Доля дохода, которую откладываем
        min_income:
          description: Поступления меньше этой суммы не трогаем
          allOf:
            - $ref: "#/components/schemas/Money"
        min_transfer:
          description: Минимальный перевод, по умолчанию 10000 (100 ₽)
          allOf:
            - $ref: "#/components/schemas/Money"
        declared_income:
          description: Примерный месячный доход из анкеты (для клиента без истории)
          allOf:
            - $ref: "#/components/schemas/Money"
        paused: { type: boolean, default: false }
        quiet_from: { type: string, pattern: "^\\d{2}:\\d{2}$", default: "23:00", description: Тихие часы — с какого времени не беспокоить }
        quiet_to: { type: string, pattern: "^\\d{2}:\\d{2}$", default: "09:00", description: Тихие часы — до какого времени }
        timezone: { type: string, default: Europe/Moscow, description: Часовой пояс клиента (IANA) }

    SavingsRulePatch:
      type: object
      description: Передаются только изменяемые поля
      properties:
        paused: { type: boolean }
        save_percent: { type: integer, minimum: 1, maximum: 50 }
        quiet_from: { type: string, example: "22:00" }
        quiet_to: { type: string, example: "08:00" }
        timezone: { type: string, example: Asia/Yekaterinburg }

    Transaction:
      type: object
      required: [id, client_id, amount, type, counterparty_kind, occurred_at]
      properties:
        id: { type: string, description: Уникален; по нему идемпотентность }
        client_id: { type: string }
        amount: { $ref: "#/components/schemas/Money" }
        type: { $ref: "#/components/schemas/TxKind" }
        counterparty: { type: string, example: ООО Ромашка }
        counterparty_kind: { $ref: "#/components/schemas/CounterpartyKind" }
        occurred_at: { type: string, format: date-time }

    ClassifiedTransaction:
      allOf:
        - $ref: "#/components/schemas/Transaction"
        - type: object
          required: [income_kind]
          properties:
            income_kind: { $ref: "#/components/schemas/IncomeKind" }

    TransactionResult:
      type: object
      required: [income_kind]
      properties:
        income_kind: { $ref: "#/components/schemas/IncomeKind" }
        decision:
          nullable: true
          description: "`null`, если поступление не доход"
          allOf:
            - $ref: "#/components/schemas/Decision"

    Decision:
      type: object
      required: [id, client_id, source_tx_id, action, amount, reason, status, created_at]
      properties:
        id: { type: string }
        client_id: { type: string }
        source_tx_id: { type: string }
        action: { $ref: "#/components/schemas/DecisionAction" }
        amount:
          description: Предлагаемая или переведённая сумма
          allOf:
            - $ref: "#/components/schemas/Money"
        options:
          type: array
          description: Варианты ответа для `ask`; «пропустить» есть всегда
          items: { $ref: "#/components/schemas/Money" }
        reason: { type: string, example: "Доход ниже обычного на 20%" }
        status: { $ref: "#/components/schemas/DecisionStatus" }
        created_at: { type: string, format: date-time }
        expires_at:
          type: string
          format: date-time
          nullable: true
          description: Только для `pending`; через 24 часа после `notify_at` срабатывает безопасный вариант
        notify_at:
          type: string
          format: date-time
          nullable: true
          description: Когда отправить уведомление клиенту; если решение принято в тихие часы — их конец
        explanation:
          nullable: true
          description: |
            Из чего сложилась сумма: сколько на карте, какие траты впереди, сколько безопасно.
            Нет у решений, где считать нечего: арест, пауза, цель достигнута, не доход, простой режим.
          allOf:
            - $ref: "#/components/schemas/Explanation"

    Explanation:
      type: object
      required: [card_balance, upcoming_total, buffer, safe_amount, until, upcoming, summary]
      properties:
        card_balance:
          description: Свои деньги на карте вместе с этим поступлением (кредитный лимит не считается)
          allOf: [{ $ref: "#/components/schemas/Money" }]
        upcoming_total:
          description: Сколько понадобится до следующего дохода
          allOf: [{ $ref: "#/components/schemas/Money" }]
        buffer:
          description: Неприкосновенный остаток
          allOf: [{ $ref: "#/components/schemas/Money" }]
        safe_amount:
          description: Сколько можно отложить безопасно = card_balance − upcoming_total − buffer (не меньше 0)
          allOf: [{ $ref: "#/components/schemas/Money" }]
        until: { type: string, format: date-time, description: До какой даты считали — ожидаемый следующий доход }
        upcoming:
          type: array
          description: Предстоящие траты по отдельности
          items: { $ref: "#/components/schemas/UpcomingItem" }
        summary:
          type: string
          description: То же самое текстом, готово к показу клиенту
          example: |-
            Можно безопасно отложить до 1 000 ₽
            До 19 ноября предстоят траты на 25 000 ₽:
            • Рассрочка за ноутбук — 6 000 ₽, 25 октября
            • Повседневные траты — 18 000 ₽ (≈ 600 ₽ в день × 30 дн.)
            На карте 26 000 ₽ − 25 000 ₽ = 1 000 ₽.

    UpcomingItem:
      type: object
      required: [title, amount]
      properties:
        title: { type: string, example: Рассрочка за ноутбук }
        amount: { $ref: "#/components/schemas/Money" }
        at: { type: string, format: date-time, description: Дата обязательного платежа; нет у повседневных трат }
        per_day:
          description: Только у повседневных трат — сколько в день
          allOf: [{ $ref: "#/components/schemas/Money" }]
        days: { type: integer, description: Только у повседневных трат — за сколько дней }

    AnswerRequest:
      type: object
      required: [choice]
      properties:
        choice:
          type: string
          description: "`amount`/`skip` — для вопроса о сумме; `yes`/`no` — для «это ваш доход?»"
          enum: [amount, skip, yes, no]
        amount:
          description: Обязательна при `choice=amount`
          allOf:
            - $ref: "#/components/schemas/Money"

    Savings:
      type: object
      properties:
        client_id: { type: string }
        goal_name: { type: string }
        goal_amount: { $ref: "#/components/schemas/Money" }
        balance:
          description: Баланс копилки
          allOf:
            - $ref: "#/components/schemas/Money"
        card_balance:
          description: Собственные деньги на карте
          allOf:
            - $ref: "#/components/schemas/Money"
        progress_percent:
          type: number
          format: float
          minimum: 0
          maximum: 100
        paused: { type: boolean }
        mode: { $ref: "#/components/schemas/Mode" }
        arrested: { type: boolean, description: Счёт арестован — переводы невозможны }
        pending_decision_id:
          type: string
          nullable: true
          description: Открытый вопрос клиенту, если есть
