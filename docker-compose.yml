services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: zapas
      POSTGRES_PASSWORD: zapas
      POSTGRES_DB: zapas
    ports: ["5433:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zapas"]
      interval: 2s
      retries: 15

  swagger:
    image: swaggerapi/swagger-ui
    environment:
      SWAGGER_JSON: /spec/openapi.yaml
    volumes: ["./src/api:/spec:ro"]
    ports: ["8081:8080"]

volumes:
  pgdata:
